<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Answer in Light</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Gowun+Batang&family=Nanum+Pen+Script&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="scene"></div>
    <div id="ui">
      <aside class="card" id="card"></aside>
      <section class="gauge" id="gauge">
        <div class="gauge-label" id="gauge-label"></div>
        <div class="cells" id="cells"></div>
      </section>
      <section class="log" id="log-panel">
        <h2 id="log-title"></h2>
        <ol id="log"></ol>
      </section>
      <p class="message" id="message" aria-live="polite"></p>
      <section class="note-wrap" id="note-wrap">
        <div class="note" id="note" role="textbox" aria-multiline="false"></div>
        <div class="note-foot">
          <span class="counter" id="counter"></span>
          <button class="lever" id="lever" type="button"><span class="hold"></span><span id="lever-label"></span></button>
        </div>
      </section>
      <pre class="debug" id="debug" hidden></pre>
    </div>
    <div class="overlay" id="start">
      <h1>Answer in Light</h1>
      <p class="sub" id="start-sub"></p>
      <div class="lang">
        <button type="button" data-lang="en">English</button>
        <button type="button" data-lang="ko">한국어</button>
      </div>
      <p id="register-label"></p>
      <input id="name" maxlength="20" autocomplete="off" />
      <button type="button" class="primary" id="start-btn"></button>
    </div>
    <div class="overlay" id="ending" hidden>
      <p id="ending-text"></p>
      <button type="button" class="primary" id="restart"></button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
